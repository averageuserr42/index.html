<!DOCTYPE html>
<html lang="de">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>CSS Animations</title>
        <link rel="stylesheet" href="style1.css">
    </head>

    <body>
<header>
    <h1>Willkomen auf unsere <Animations-Seite></Animations-Seite> </h1>'
<p> Bewege die Maus über das Element, um die Animation zu sehen.</p>
    </header>
    <main>
    <!-- Hover Effect-->
     <section>
        <h2> Die schwebende Katze</h2>
        <div class="cat">🐱</div>
        <div class="kitten">🐾</div>
     </section>
     <section>
        <h2>Der farbewechelnde Button mit Klick & Hover</h2>
        <button class="color-button">Klick mich!</button>
     </section>
     <!-- Springedner ball-->
    <section>
        <h2>Der hüpfende Ball</h2>
        <div class="ball-area">
            <div class="ball">⚽</div>
        </div>
    </section>
    <section>
         <h2>Ein normales bild aus dem Internet</h2>
         <img src="https://cdn.pixabay.com/photo/2019/02/02/18/03/cat-3971068_1280.jpg" alt="Platzhalter-Bild" style="max-width: 100%; height: auto;">
    </section>
    </main>
    </body>
</html>
